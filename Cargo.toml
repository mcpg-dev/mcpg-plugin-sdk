[package]
name = "mcpg-plugin-sdk"
version = "0.1.0-beta.13"
license = "Apache-2.0"
edition = "2024"
description = "Developer SDK for building MCPG plugins — testing harness, project templates, and utilities"

[features]
# Recognised-but-empty feature. The unified `declare_plugin!` macro
# emits `#[cfg(feature = "cdylib-export")]` on the
# `mcpg_plugin_register` symbol — plugin crates enable that
# feature to make the symbol exportable when building as a
# cdylib. The feature lives HERE so rustc's unexpected-cfgs
# check doesn't fire when the macro is invoked from plugin-sdk's
# own tests (where the symbol should NOT be emitted — two test
# plugins in the same crate would collide on the
# `mcpg_plugin_register` name).
cdylib-export = []

# The unified `declare_plugin!` macro emits a
# `register_static()` function that wires the plugin into the host's
# `FirstPartyRegistrar` without going through the FFI vtable. The
# function references `::mcpg_plugin_host::FirstPartyRegistrar` so
# the plugin crate must bring `mcpg-plugin-host` (and `anyhow`) into
# its dep graph. Feature-gated so cdylib-only plugins (no static
# path) don't pay the dep cost.
static-firstparty = ["dep:mcpg-plugin-host", "dep:anyhow", "dep:tokio"]

# Enables streaming-body support in the unified
# `declare_plugin!` macro's `http_route` and `transport` arms.
# The macro references `::tokio::runtime::Handle` to spawn a task
# that drives the plugin's `HttpBody::Stream` or transport
# accept loop. Feature-gated so bytes-only plugins don't carry a
# tokio dep.
streaming = ["dep:tokio", "futures-core"]

# The shared `ffi::cluster_forward` helper that bridges a
# cluster pub/sub / peer-watch async stream into the host's synchronous
# `emit_event` FFI callback (with a use-after-free guard). The
# cdylib cluster_backend plugins (consul / etcd / redis / nats) enable this.
cluster-forward = ["dep:tokio", "futures-core"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }
mcpg-cluster-api = { git = "https://github.com/mcpg-dev/mcpg-cluster-api", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Decode the base64 cache_get wire payload (host base64-encodes the bytes).
base64 = "0.22"
# Re-exported from lib.rs so cdylib plugins using `declare_plugin!`
# only need a single `mcpg-plugin-sdk` dep — the macro expansion
# references `::abi_stable::std_types` paths.
abi_stable = "0.11"
# Optional, enabled by the `streaming` feature. Used by
# the `declare_plugin!` macro's `http_route` + `transport` arms to
# spawn the stream-drain / accept-loop tasks. `rt` gives
# `Handle::current()` + `spawn`; no net / sync features — plugin
# authors bring those themselves when needed.
tokio = { version = "1", features = ["rt"], optional = true }
futures-core = { version = "0.3", default-features = false, features = ["std"], optional = true }
# Used by the `cluster` module's `ClusterClient::publish` to take a
# pre-allocated payload buffer without copying. `bytes` is already a
# transitive dep of plugin-protocol (cluster module) — re-declared
# here to make it a direct dep so the SDK module compiles standalone.
bytes = "1"
# Subscription trampolines log undecodable event payloads at warn
# level so a misbehaving coordinator is visible in ops instead of
# silently dropped.
tracing = "0.1"
# The `Sync*Adapter` newtypes in `adapters.rs`
# bridge sync `SyncToolGate`-style traits into the async
# `ToolGatePlugin`-style traits the host registry consumes. The
# unified `declare_plugin!` macro uses these to emit a
# `register_static()` function that takes the same plugin type a
# cdylib build would expose, but routes it through the in-process
# trait dispatch instead of the FFI vtable.
async-trait = "0.1"
# Optional — only pulled in when the consumer enables
# `static-firstparty`. Hosts the `FirstPartyRegistrar` that
# `declare_plugin!`'s `register_static()` expansion references.
mcpg-plugin-host = { git = "https://github.com/mcpg-dev/mcpg-plugin-host", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13", optional = true }
anyhow = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
# `http_route` dispatch-helper tests construct `HttpRouteRequest`
# literals with an empty `bytes::Bytes` body; shared with plugin-protocol.
bytes = "1"
# An integration test parses the macro's embedded
# descriptor YAML + cross-checks against the in-code manifest.
serde_yaml = "0.9"
# The cluster-coordinator MockGateway test uses an
# empty `BoxPeerEventStream`; `futures-core` gives us `Stream`
# without pulling the full `futures` crate.
futures-core = { version = "0.3", default-features = false, features = ["std"] }

# Conformance test:
# `declare_plugin_static_fastpath` exercises the static path
# end-to-end: it builds a real `PluginRegistry`, wires multiple
# entities through `register_static()`, and asserts
# per-call latency. Requires the static-firstparty feature so the
# macro's `register_static` expansion compiles.
